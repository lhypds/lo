<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget says what the on-screen keyboard is allowed to do to
         the page: take its room out of the window, the way a smaller window
         would, rather than slide up over the top of it and leave the browser to
         scroll whatever was underneath into sight. The sheets that ask for a line
         of text — naming a spot, writing a post — are laid out against the window,
         so a window that shortens for the keys is one they still fit in. Not every
         browser knows this yet, and the ones that do not scroll instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>lo</title>
    <script>
      (function () {
        function setVh() {
          document.documentElement.style.setProperty("--vh", window.innerHeight * 0.01 + "px");
        }
        setVh();
        window.addEventListener("resize", setVh);
        window.addEventListener("orientationchange", setVh);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", setVh);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
