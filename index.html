<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget says what the on-screen keyboard is allowed to do to
         the page: take its room out of the window, the way a smaller window
         would, rather than slide up over the top of it and leave the browser to
         scroll whatever was underneath into sight. The sheets that ask for a line
         of text — naming a spot, writing a post — are laid out against the window,
         so a window that shortens for the keys is one they still fit in. Not every
         browser knows this yet, and the ones that do not scroll instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>lo</title>
    <script>
      (function () {
        var lastHeight = window.innerHeight;
        var viewportFrame = 0;

        function setVh() {
          document.documentElement.style.setProperty("--vh", window.innerHeight * 0.01 + "px");
        }

        // The one thing a window that has just shortened does not do for itself.
        // A field is revealed when it is focused, and the room the page has is
        // taken away after that — by the keys where the browser hands them their
        // own space (interactive-widget above), and by the Even frame, which sizes
        // this page to whatever is left above them. A sheet capped at 90vh and
        // scrolling inside shortens with it and keeps the field where it was,
        // which by then is under its own fold, and nothing reveals it a second
        // time. So it is revealed again here.
        //
        // Only on the way down, and only ever as far as it has to go: `nearest`
        // leaves a field that is still in sight alone, which is most of them, and
        // brings the rest just clear of the edge rather than hauling the sheet
        // about. Growing back when the keys go away is not something to move
        // anybody's page for, hence the compare.
        function keepFocusVisible() {
          var height = window.innerHeight;
          var shorter = height < lastHeight;
          lastHeight = height;
          if (!shorter) return;
          var el = document.activeElement;
          if (!el) return;
          var tag = el.tagName;
          if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT" && !el.isContentEditable) return;
          // After the layout the resize asked for, not in the middle of it: the
          // keys animate, this fires the whole way up, and the answer wanted is
          // where the field is once the page is the size it is being told about.
          requestAnimationFrame(function () {
            el.scrollIntoView({ block: "nearest", behavior: "auto" });
          });
        }

        function onViewport() {
          // An embedded WebView can report the same keyboard/viewport step via
          // both window.resize and visualViewport.resize.  Writing --vh in each
          // callback forces layout twice, which in turn resizes the Mapbox
          // canvas.  Fold every burst into one layout update per paint.
          if (viewportFrame) return;
          viewportFrame = requestAnimationFrame(function () {
            viewportFrame = 0;
            setVh();
            keepFocusVisible();
          });
        }

        setVh();
        window.addEventListener("resize", onViewport);
        window.addEventListener("orientationchange", onViewport);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", onViewport);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
